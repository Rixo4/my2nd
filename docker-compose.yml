version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: tradewise-redis
    ports:
      - "6379:6379"
    restart: always

  server:
    build: ./server
    container_name: tradewise-server
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - TWELVE_DATA_API_KEY
      - FINNHUB_API_KEY
      - GROQ_API_KEY
      - NEWSAPI_KEY
      - HUGGINGFACE_API_KEY
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: always

  client:
    build: ./client
    container_name: tradewise-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: always
